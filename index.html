<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApuestasPRO</title>
    <meta name="description" content="Sistema responsive para clientes, balances y apuestas deportivas." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="desktop-sidebar" aria-label="Panel lateral de escritorio">
        <div class="brand-block">
          <span class="brand-mark">AP</span>
          <div><strong>ApuestasPRO</strong><small>Agencia deportiva</small></div>
        </div>
        <nav class="desktop-nav" id="desktopNav" aria-label="Navegación principal"></nav>
        <div class="site-card compact">
          <span><i class="live-dot"></i> Casas conectadas</span>
          <strong>4 sitios</strong>
          <small>SuperBets, NetBet, Apuesta Total y Juancito Sport listos para consulta manual o automatización futura.</small>
        </div>
      </aside>

      <section class="content-shell">
        <header class="topbar">
          <div>
            <p class="eyebrow">Sistema responsive</p>
            <h1 id="pageTitle">Panel</h1>
          </div>
          <button class="primary-button" id="newBetTop">+ Nueva apuesta</button>
        </header>
        <section id="viewRoot" aria-live="polite"></section>
      </section>

      <nav class="mobile-tabbar" id="mobileNav" aria-label="Navegación móvil"></nav>
      <button class="floating-action" id="floatingBet" aria-label="Nueva apuesta rápida">⚡</button>
      <section id="modalRoot"></section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
